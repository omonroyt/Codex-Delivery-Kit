name: Template CI CD

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".codex/skills/project-scaffolding/**"
      - ".github/workflows/template-cicd.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".codex/skills/project-scaffolding/**"
      - ".github/workflows/template-cicd.yml"

jobs:
  node-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scaffold react
        run: node scripts/scaffold-webapp.js --template react-tailwind-vite --target .tmp/react
      - name: Build react
        working-directory: .tmp/react
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run build

      - name: Scaffold fastify
        run: node scripts/scaffold-webapp.js --template fastify-prisma-postgres --target .tmp/fastify
      - name: Build and test fastify
        working-directory: .tmp/fastify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
        run: |
          npm install --no-audit --no-fund
          npm run prisma:generate
          npm run test
          npm run test:e2e
          npm run build

      - name: Scaffold nestjs
        run: node scripts/scaffold-webapp.js --template nestjs-prisma-postgres --target .tmp/nest
      - name: Build and test nestjs
        working-directory: .tmp/nest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
        run: |
          npm install --no-audit --no-fund
          npm run prisma:generate
          npm run test
          npm run test:e2e
          npm run build

  python-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scaffold fastapi
        run: node scripts/scaffold-webapp.js --template fastapi-postgres --target .tmp/fastapi
      - name: Install and test fastapi
        working-directory: .tmp/fastapi
        env:
          DATABASE_URL: sqlite:///./app.db
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q

  go-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Scaffold go
        run: node scripts/scaffold-webapp.js --template go-gin-postgres --target .tmp/go
      - name: Build and test go
        working-directory: .tmp/go
        run: |
          go mod tidy
          go test ./...
          go build ./...

  java-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scaffold java
        run: node scripts/scaffold-webapp.js --template java-spring-postgres --target .tmp/java
      - name: Build and test java
        working-directory: .tmp/java
        run: mvn -B test package

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scaffold fullstack rapid preview
        run: node scripts/scaffold-webapp.js --preset rapid --project-type fullstack --frontend react --target .tmp/fullstack-preview

      - name: Build web preview
        working-directory: .tmp/fullstack-preview/apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-web-dist
          path: .tmp/fullstack-preview/apps/web/dist
