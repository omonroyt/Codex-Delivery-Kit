name: Template Security

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".codex/skills/project-scaffolding/**"
      - ".github/workflows/template-security.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".codex/skills/project-scaffolding/**"
      - ".github/workflows/template-security.yml"

jobs:
  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scaffold fastify
        run: node scripts/scaffold-webapp.js --template fastify-prisma-postgres --target .tmp/fastify
      - name: npm audit fastify
        working-directory: .tmp/fastify
        run: |
          npm install --no-fund
          npm audit --audit-level=high

      - name: Scaffold nest
        run: node scripts/scaffold-webapp.js --template nestjs-prisma-postgres --target .tmp/nest
      - name: npm audit nest
        working-directory: .tmp/nest
        run: |
          npm install --no-fund
          npm audit --audit-level=high

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scaffold fastapi
        run: node scripts/scaffold-webapp.js --template fastapi-postgres --target .tmp/fastapi

      - name: Run pip audit
        working-directory: .tmp/fastapi
        run: pip-audit -r requirements.txt

  go-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scaffold go
        run: node scripts/scaffold-webapp.js --template go-gin-postgres --target .tmp/go

      - name: Run govulncheck
        working-directory: .tmp/go
        run: |
          go mod tidy
          govulncheck ./...

  java-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scaffold java
        run: node scripts/scaffold-webapp.js --template java-spring-postgres --target .tmp/java

      - name: Run OWASP dependency-check
        working-directory: .tmp/java
        run: mvn -B -DskipTests org.owasp:dependency-check-maven:check
